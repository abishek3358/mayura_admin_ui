<div class="card  ">
    <div class="card-body">
        <div class="row">
            <div class="col-6">
                <div class=" pageHeading">
                    <h4 class="">Debit</h4>
                </div>
            </div>
            <div class="col-6">
                <div class="text-right my-auto ">
                    <button type="button" class="btn btn-primary btn-sm p-1 mb-2" routerLink="new">
                        Add
                    </button>
                </div>
            </div>
        </div>

        <div class="">
            <table class="table bg-white table-bordered" id="debitTable">
                <thead>
                    <tr>
                        <th>S.NO</th>
                        <th>Job/Project Code</th>
                        <th>Bill No</th>
                        <th>Vendor</th>
                        <th>Transaction Ref No</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let debit of debitList; let i = index">
                        <td>{{i+1}}</td>
                        <td>{{debit.jobCode}}</td>
                        <td>{{debit.billNo}}</td>
                        <td>{{debit.vendorName}}</td>
                        <td>{{debit.transactionReferenceNo}}</td>

                        <td>
                            <div ngbDropdown container="body">
                                <button type="button" class="btn btn-sm hide-arrow" ngbDropdownToggle
                                    data-toggle="dropdown">
                                    <i class='bx bx-dots-vertical-rounded' style='color:#858080'></i>
                                </button>
                                <div ngbDropdownMenu>
                                    <a ngbDropdownItem (click)="editDebit(debit.id)"><i
                                            class='bx bxs-edit text-success'></i><span class="ml-2">Edit</span></a><a
                                        ngbDropdownItem (click)="deleteConfirmation(deleteDebit,debit)"><i class='bx bxs-trash-alt'
                                            style='color:#c32424'></i><span class="ml-2">Delete</span></a>
                                </div>

                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
<ng-template #deleteDebit let-modal>
    <div class="modal-header">
        <h5 class="modal-title">Confirm Delete</h5>
        <button type="button" class="close" aria-label="Close" (click)="modal.dismiss('Cross click')">
            <span aria-hidden="true">&times;</span>
        </button>
    </div>
    <div class="modal-body">
        <h6 class="text-center mt-2">Are you sure want to delete?</h6>
        <div class="text-right mt-2 ">
            <button type="button" class="btn btn-primary  ml-2 " (click)="delete(modal)">Yes</button>
        </div>
    </div>

</ng-template>
