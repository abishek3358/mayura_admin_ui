<div class="card">
    <div class="card-body">
        <div class=" pageHeading">
            <h4 class="">MIS Expense</h4>
        </div>
        <div>
            <form [formGroup]="misExpenseForm" autocomplete="off">
                <div class="row">
                    <div class="col-sm-4 form-group">
                        <label for="projectId">Job/Project Code</label>
                        <ng-select [items]="jobCodeArr" id="jobCode" bindLabel="jobCode" bindValue="id" placeholder="Choose" formControlName="projectId" [ngClass]="{ 'is-invalid': misExpenseSubmitted && f.projectId.errors }">
                        </ng-select>
                        <div *ngIf="misExpenseSubmitted && f.projectId.errors" class="invalid-feedback">
                            <div *ngIf="f.projectId.errors.required">
                                Required</div>
                        </div>
                    </div>
                    <div class="col-sm-4 form-group">
                        <label for="accountGroupId">Account Group </label>
                        <ng-select [items]="accountGroupArr" id="accountGroupName" groupBy="accountName" bindLabel="name" bindValue="id" placeholder="Choose" formControlName="accountGroupId" [ngClass]="{ 'is-invalid': misExpenseSubmitted && f.accountGroupId.errors }">
                        </ng-select>
                        <div *ngIf="misExpenseSubmitted && f.accountGroupId.errors" class="invalid-feedback">
                            <div *ngIf="f.accountGroupId.errors.required">
                                Required</div>
                        </div>
                    </div>
                    <div class="col-sm-4 form-group">
                        <label for="categoryId">Category</label>
                        <ng-select [items]="categoryArr" id="categoryName" bindLabel="name" bindValue="id" placeholder="Choose" formControlName="categoryId" [ngClass]="{ 'is-invalid': misExpenseSubmitted && f.categoryId.errors }">
                        </ng-select>
                        <div *ngIf="misExpenseSubmitted && f.categoryId.errors" class="invalid-feedback">
                            <div *ngIf="f.categoryId.errors.required">
                                Required</div>
                        </div>
                    </div>

                    <div class="col-sm-4">
                        <div class="form-group">
                            <label for="referenceNo">Reference No</label>
                            <input id="referenceNo" type="number" class="form-control" formControlName="referenceNo" placeholder="Reference No" [ngClass]="{ 'is-invalid': misExpenseSubmitted && f.referenceNo.errors}">
                            <div *ngIf="misExpenseSubmitted && f.referenceNo.errors" class="invalid-feedback">
                                <div *ngIf="f.referenceNo.errors.required">Required</div>
                            </div>
                        </div>
                    </div>
                    <div class="col-sm-4">
                        <div class="form-group">
                            <label for="expenseName">Expense Name</label>
                            <input id="expenseName" type="text" class="form-control" formControlName="expenseName" placeholder="Expense Name" [ngClass]="{ 'is-invalid': misExpenseSubmitted && f.expenseName.errors}">
                            <div *ngIf="misExpenseSubmitted && f.expenseName.errors" class="invalid-feedback">
                                <div *ngIf="f.expenseName.errors.required">Required</div>
                            </div>
                        </div>
                    </div>

                    <div class="col-sm-4">
                        <div class="form-group">
                            <label for="amount">Amount</label>
                            <input id="amount" type="text" class="form-control" formControlName="amount" placeholder="Amount" [ngClass]="{ 'is-invalid': misExpenseSubmitted && f.amount.errors}">
                            <div *ngIf="misExpenseSubmitted && f.amount.errors" class="invalid-feedback">
                                <div *ngIf="f.amount.errors.required">Required</div>
                            </div>
                        </div>
                    </div>
                    <div class="col-sm-4">
                        <div class="form-group ">
                            <label for="date">Date</label>
                            <input class="form-control" id="date" placeholder="yyyy-mm-dd" formControlName="date" ngbDatepicker #date="ngbDatepicker" (click)="date.toggle()" [ngClass]="{ 'is-invalid': misExpenseSubmitted && f.date.errors}">
                            <div *ngIf="misExpenseSubmitted && f.date.errors" class="invalid-feedback">
                                <div *ngIf="f.date.errors.required">Required</div>
                            </div>
                        </div>
                    </div>
                    <div class="col-sm-4">
                        <div class="form-group">
                            <label for="notes">Notes</label>
                            <textarea id="notes" type="text" class="form-control" formControlName="notes" placeholder="Notes" [ngClass]="{ 'is-invalid': misExpenseSubmitted && f.notes.errors}"> </textarea>
                            <div *ngIf="misExpenseSubmitted && f.notes.errors" class="invalid-feedback">
                                <div *ngIf="f.notes.errors.required">Required</div>
                            </div>
                        </div>
                    </div>


                    <div class="text-right col-12 mt-2">
                        <button class="btn btn-primary" (click)="onSubmit()">Submit</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
