<div class="container-fluid px-0">
    <div class="card">
        <div class="card-body">
            <div class="row">
                <div class="col-xl-12">
                    <div class="row">
                        <div class="col-6">
                            <div class="pageHeading">
                                <h4>MIS Expense</h4>
                            </div>
                        </div>
                        <div class="col-6">
                            <div class="text-right my-auto ">
                                <button type="button" class="btn btn-primary btn-sm p-1 mb-2" routerLink="new">
                                    Add
                                </button>

                            </div>
                        </div>
                    </div>
                    <form [formGroup]="misExpenseForm">
                        <div class="row ">
                            <div class="col-sm-4 form-group">
                                <label for="projectId">Job/Project Code</label>
                                <ng-select [items]="jobCodeArr" id="jobCode" [clearable]="false" bindLabel="jobCode"
                                    bindValue="id" placeholder="Choose" formControlName="projectId"
                                    (change)="jobCode($event)"
                                    [ngClass]="{ 'is-invalid': misExpenseSubmitted && f.projectId.errors }">
                                </ng-select>
                                <div *ngIf="misExpenseSubmitted && f.projectId.errors" class="invalid-feedback">
                                    <div *ngIf="f.projectId.errors.required">
                                        Required</div>
                                </div>
                            </div>
                            <div class="col-sm-4 form-group">
                                <label for="categoryId">Category</label>
                                <ng-select [items]="categoryArr" [clearable]="true" id="categoryName" bindLabel="name"
                                    bindValue="id" placeholder="Choose" formControlName="categoryId"
                                    (change)="category($event)"
                                    [ngClass]="{ 'is-invalid': misExpenseSubmitted && f.categoryId.errors }">
                                </ng-select>
                                <div *ngIf="misExpenseSubmitted && f.categoryId.errors" class="invalid-feedback">
                                    <div *ngIf="f.categoryId.errors.required">
                                        Required</div>
                                </div>
                            </div>
                            <div class=" col-sm-1 pt-2 ">
                                <button class="btn btn-primary" (click)="onSubmit()">Fetch</button>
                            </div>
                            <!-- <div class=" col-sm-1 pt-2 ml-sm-1">
                                <button class="btn btn-primary" (click)="cancel()">Clear</button>
                            </div> -->
                        </div>
                    </form>
                    <ngx-simplebar>

                  
                    <table id="misExpenseTable" *ngIf="WaitingFortheResponse" class="table table-bordered"
                        style="width:100%">
                        <thead>
                            <tr>
                                <th>S.No</th>
                                <th>Rf.No</th>
                                <th>Date</th>
                                <th>Expense Name</th>
                                <th>Notes</th>
                                <th>Amount</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr *ngFor="let misExpense of misExpenseArr;let i = index">
                                <td>{{i+1}}</td>
                                <td>{{misExpense.referenceNo}}</td>
                                <td>{{misExpense.date}}</td>
                                <td>{{misExpense.expenseName}}</td>
                                <td>{{misExpense.notes}}</td>
                                <td>{{misExpense.amount}}</td>
                                <td>
                                    <div ngbDropdown container="body">
                                        <button type="button" class="btn btn-sm hide-arrow" ngbDropdownToggle
                                            data-toggle="dropdown">
                                            <i class='bx bx-dots-vertical-rounded' style='color:#858080'></i>
                                        </button>

                                        <div ngbDropdownMenu>
                                            <!-- <a ngbDropdownItem><i class='bx bx-notepad text-primary'></i><span
                                                    class="ml-2">View</span></a> -->
                                            <a ngbDropdownItem (click)="editmisExpense(misExpense.id)"><i
                                                    class='bx bxs-edit text-success'></i><span
                                                    class="ml-2">Edit</span></a><a ngbDropdownItem
                                                (click)="deleteConfirmation(deleteMisExpense,misExpense)"><i class='bx bxs-trash-alt'
                                                    style='color:#c32424'></i><span class="ml-2">Delete</span></a>
                                        </div>
                                    </div>

                                </td>
                            </tr>
                        </tbody>
                    </table>
                      </ngx-simplebar>
                </div>
            </div>
        </div>
    </div>
</div>
<ng-template #deleteMisExpense let-modal>
    <div class="modal-header">
        <h5 class="modal-title">Confirm Delete</h5>
        <button type="button" class="close" aria-label="Close" (click)="modal.dismiss('Cross click')">
            <span aria-hidden="true">&times;</span>
        </button>
    </div>
    <div class="modal-body">
        <h6 class="text-center mt-2">Are you sure want to delete?</h6>
        <div class="text-right mt-2 ">
            <button type="button" class="btn btn-primary  ml-2 " (click)="deletemisExpense(modal)">Yes</button>
        </div>
    </div>
</ng-template>
