<section class="horizontal-wizard">
    <div id="stepper1" class="bs-stepper horizontal-wizard-example">
        <div class="bs-stepper-header">
            <div class="step" data-target="#personal-info">
                <button class="step-trigger">
                    <span class="bs-stepper-box">
                        <i class='bx bxs-user-detail font-medium-3'></i>
                    </span>
                    <span class="bs-stepper-label">
                        <span class="bs-stepper-title">Contractor Basic Details</span>
                        <span class="bs-stepper-subtitle">Add Contractor Info</span>

                    </span>
                </button>
            </div>
            <div class="line"> <i data-feather="chevron-right" class='bx bx-chevron-right' style='color:#b9b9c3'></i>
            </div>
            <div class="step" data-target="#account-details">
                <button class="step-trigger">
                    <span class="bs-stepper-box">
                        <i class='bx bx-map font-medium-3'></i>
                    </span>
                    <span class="bs-stepper-label">
                        <span class="bs-stepper-title">Address</span>
                        <span class="bs-stepper-subtitle">Add Address</span>
                    </span>
                </button>
            </div>
        </div>
        <div class="bs-stepper-content">
            <form [formGroup]="contractorForm" autocomplete="off">
                <div id="personal-info" class="content">

                    <div class="content-header">
                        <h5 class="mb-0">Basic Info</h5>
                        <!-- <small class="text-muted">Enter Contractor Personal Info.</small> -->
                    </div>
                    <div class="row">
                        <div class="form-group col-sm-6">
                            <label for="fullName">Name</label>
                            <input id="fullName" type="text" class="form-control" formControlName="fullName" placeholder="Name" [ngClass]="{ 'is-invalid': contractorSubmited && f.fullName.errors }">
                            <div *ngIf="contractorSubmited && f.fullName.errors" class="invalid-feedback">
                                <div *ngIf="f.fullName.errors.required">Required</div>
                            </div>
                        </div>
                        <div class="form-group col-sm-6">
                            <label for="companyName">Company Name</label>
                            <input id="companyName" type="text" class="form-control" formControlName="companyName" placeholder="Company Name" [ngClass]="{ 'is-invalid': contractorSubmited && f.companyName.errors }">
                            <div *ngIf="contractorSubmited && f.companyName.errors" class="invalid-feedback">
                                <div *ngIf="f.companyName.errors.required">Required</div>
                            </div>
                        </div>
                        <div class="form-group col-sm-6">
                            <label for="email">Email</label>
                            <input id="email" type="text" class="form-control" formControlName="email" placeholder="Email" [ngClass]="{ 'is-invalid': contractorSubmited && f.email.errors }">
                            <div *ngIf="contractorSubmited && f.email.errors" class="invalid-feedback">
                                <div *ngIf="f.email.errors.required">Required</div>
                            </div>
                        </div>
                        <div class="form-group col-sm-6">
                            <label for="mobileNo">Mobile No</label>
                            <input id="mobileNo" type="text" class="form-control" formControlName="mobileNo" placeholder="Mobile No" [ngClass]="{ 'is-invalid': contractorSubmited && f.mobileNo.errors }">
                            <div *ngIf="contractorSubmited && f.mobileNo.errors" class="invalid-feedback">
                                <div *ngIf="f.mobileNo.errors.required">Required</div>
                            </div>
                        </div>
                        <div class="form-group col-sm-6">
                            <label for="panNumber">PAN No</label>
                            <input id="panNumber" type="text" class="form-control" formControlName="panNumber" placeholder="Pan No" [ngClass]="{ 'is-invalid': contractorSubmited && f.panNumber.errors }">
                            <div *ngIf="contractorSubmited && f.panNumber.errors" class="invalid-feedback">
                                <div *ngIf="f.panNumber.errors.required">Required</div>
                            </div>
                        </div>
                        <div class="form-group col-sm-6">
                            <label for="gstNumber">GST No</label>
                            <input id="gstNumber" type="text" class="form-control" formControlName="gstNumber" placeholder="GST No" [ngClass]="{ 'is-invalid': contractorSubmited && f.gstNumber.errors }">
                            <div *ngIf="contractorSubmited && f.gstNumber.errors" class="invalid-feedback">
                                <div *ngIf="f.gstNumber.errors.required">Required</div>
                            </div>
                        </div>
                        <div class="form-group col-sm-6">
                            <label for="accountHolderName">Account Holder Name</label>
                            <input id="accountHolderName" type="text" class="form-control" formControlName="accountHolderName" placeholder="Account Holder Name" [ngClass]="{ 'is-invalid': contractorSubmited && f.accountHolderName.errors }">
                            <div *ngIf="contractorSubmited && f.accountHolderName.errors" class="invalid-feedback">
                                <div *ngIf="f.accountHolderName.errors.required">Required</div>
                            </div>
                        </div>

                        <div class="form-group col-sm-6">
                            <label for="accountNo">Account No</label>
                            <input id="accountNo" type="number" class="form-control" formControlName="accountNo" placeholder="Account No" [ngClass]="{ 'is-invalid': contractorSubmited && f.accountNo.errors }">
                            <div *ngIf="contractorSubmited && f.accountNo.errors" class="invalid-feedback">
                                <div *ngIf="f.accountNo.errors.required">Required</div>
                            </div>
                        </div>
                        <div class="form-group col-sm-6">
                            <label for="bankName">Bank Name</label>
                            <input id="bankName" type="text" class="form-control" formControlName="bankName" placeholder="Bank Name" [ngClass]="{ 'is-invalid': contractorSubmited && f.bankName.errors }">
                            <div *ngIf="contractorSubmited && f.bankName.errors" class="invalid-feedback">
                                <div *ngIf="f.bankName.errors.required">Required</div>
                            </div>
                        </div>
                        <div class="form-group col-sm-6">
                            <label for="ifscCode">IFSC Code</label>
                            <input id="ifscCode" type="text" class="form-control" formControlName="ifscCode" placeholder="IFSC Code" [ngClass]="{ 'is-invalid': contractorSubmited && f.ifscCode.errors }">
                            <div *ngIf="contractorSubmited && f.ifscCode.errors" class="invalid-feedback">
                                <div *ngIf="f.ifscCode.errors.required">Required</div>
                            </div>
                        </div>
                    </div>


                    <div class="d-flex justify-content-between">
                        <button class="btn btn-outline-secondary btn-prev" disabled rippleEffect>
                            <!-- <i data-feather="arrow-left" class="align-middle mr-sm-25 mr-0"></i> -->
                            <span class="align-middle d-sm-inline-block d-none">Previous</span>
                        </button>
                        <button (click)="next()" type="submit" class="btn btn-primary btn-next" rippleEffect>
                            <span class="align-middle d-sm-inline-block d-none">Next</span>
                            <!-- <i data-feather="arrow-right" class="align-middle ml-sm-25 ml-0"></i> -->
                        </button>
                    </div>

                </div>

                <div id="account-details" class="content">
                    <div class="row" formArrayName="contractorAddressList">
                        <div class="col-sm-6" *ngFor="let Bills of contractorAddressListArr.controls; let i = index" [formGroupName]="i">
                            <div class="card">
                                <div class="card-body">
                                    <div class="float-right checkbox" *ngIf="i==0">
                                        <label>
                                            <input class="box" type="checkbox" (change)="changeStatus($event)" />
                                            Same As
                                        </label>
                                    </div>
                                    <h5 class="card-title" *ngIf="i==0">Billing Address</h5>
                                    <h5 class="card-title" *ngIf="i==1">Shipping Address</h5>
                                    <div class="row">
                                        <div class="col-sm-12 form-group">
                                            <label for="addressLine1{{i}}">Address 1</label>
                                            <textarea name="addressLine1" id="addressLine1{{i}}" class="form-control" placeholder="Address 1" formControlName="addressLine1" [ngClass]="{ 'is-invalid': contractorSubmited && contractorAddressListArr.controls[i].get('addressLine1').errors }"></textarea>
                                            <div *ngIf="contractorSubmited && contractorAddressListArr.controls[i].get('addressLine1').errors" class="invalid-feedback">
                                                <div *ngIf="contractorAddressListArr.controls[i].get('addressLine1').errors.required">
                                                    Required</div>
                                            </div>
                                        </div>
                                        <div class="col-sm-12 form-group">
                                            <label for="addressLine2{{i}}">Address 2</label>
                                            <textarea name="addressLine2" class="form-control" placeholder="Address 2" id="addressLine2{{i}}" formControlName="addressLine2"></textarea>
                                            <div *ngIf="contractorSubmited && contractorAddressListArr.controls[i].get('addressLine2').errors" class="invalid-feedback">
                                                <div *ngIf="contractorAddressListArr.controls[i].get('addressLine2').errors.required">
                                                    Required</div>
                                            </div>
                                        </div>

                                        <div class="col-sm-6 form-group">
                                            <label for="addressType{{i}}">Address Type</label>
                                            <input id="addressType{{i}}" class="form-control" formControlName="addressType" [readOnly]="true">
                                        </div>
                                        <div class="col-sm-6 form-group">
                                            <label for="countryId{{i}}">Country</label>
                                            <ng-select [items]="countryArr" name="countryId" id="countryId{{i}}" (change)="getState($event.id,i)" bindLabel="name" bindValue="id" placeholder="Choose" formControlName="countryId" [ngClass]="{ 'is-invalid': contractorSubmited && contractorAddressListArr.controls[i].get('countryId').errors }">
                                            </ng-select>
                                            <div *ngIf="contractorSubmited && contractorAddressListArr.controls[i].get('countryId').errors" class="invalid-feedback">
                                                <div *ngIf="contractorAddressListArr.controls[i].get('countryId').errors.required">
                                                    Required</div>
                                            </div>
                                        </div>

                                        <div class="col-sm-6 form-group">
                                            <label for="state{{i}}">State</label>
                                            <ng-select [items]="stateListObj[i]" name="stateId" id="state{{i}}" (change)="getCity($event.id,i)" bindLabel="name" bindValue="id" placeholder="Choose" formControlName="stateId" [ngClass]="{ 'is-invalid': contractorSubmited && contractorAddressListArr.controls[i].get('stateId').errors }">
                                            </ng-select>
                                            <div *ngIf="contractorSubmited && contractorAddressListArr.controls[i].get('stateId').errors" class="invalid-feedback">
                                                <div *ngIf="contractorAddressListArr.controls[i].get('stateId').errors.required">
                                                    Required</div>
                                            </div>
                                        </div>
                                        <div class="col-sm-6 form-group">
                                            <label for="city{{i}}">City</label>
                                            <ng-select [items]="cityObj[i]" name="city{{i}}" id="city{{i}}" bindLabel="name" bindValue="id" placeholder="Choose" formControlName="cityId" [ngClass]="{ 'is-invalid': contractorSubmited && contractorAddressListArr.controls[i].get('cityId').errors }">
                                            </ng-select>
                                            <div *ngIf="contractorSubmited && contractorAddressListArr.controls[i].get('cityId').errors" class="invalid-feedback">
                                                <div *ngIf="contractorAddressListArr.controls[i].get('cityId').errors.required">
                                                    Required</div>
                                            </div>
                                        </div>
                                        <div class="col-sm-6 form-group">
                                            <label for="postalCode{{i}}">Postal Code</label>
                                            <input type="text" class="form-control" id="postalCode{{i}}" placeholder="Postal Code" formControlName="postalCode" [ngClass]="{ 'is-invalid': contractorSubmited && contractorAddressListArr.controls[i].get('postalCode').errors }">
                                            <div *ngIf="contractorSubmited && contractorAddressListArr.controls[i].get('postalCode').errors" class="invalid-feedback">
                                                <div *ngIf="contractorAddressListArr.controls[i].get('postalCode').errors.required">
                                                    Required</div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="d-flex justify-content-between">
                        <button type="button" (click)="previous()" class="btn btn-primary btn-prev" rippleEffect>
                            <!-- <i data-feather="arrow-left" class="align-middle mr-sm-25 mr-0"></i> -->
                            <span class="align-middle d-sm-inline-block d-none">Previous</span>
                        </button>
                        <button (click)="onSubmit()" class="btn btn-primary btn-next" rippleEffect>
                            <span class="align-middle d-sm-inline-block d-none">Submit</span>
                            <!-- <i data-feather="arrow-right" class="align-middle ml-sm-25 ml-0"></i> -->
                        </button>
                    </div>


                </div>

            </form>
        </div>
    </div>
</section>
