<div class="container-fluid px-0">
    <div class="card">
        <div class="card-body">
            <div class="row">
                <div class="col-xl-12">
                    <div class="row">
                        <div class="col-6">
                            <div class=" pageHeading">
                                <h4 class=""> Currency</h4>
                            </div>
                        </div>
                        <div class="col-6">
                            <div class="text-right my-auto ">
                                <button type="button" class="btn btn-primary btn-sm p-1 mb-2" (click)="openModal(countryModal)">
                                    Add
                                </button>
                            </div>
                        </div>
                    </div>


                    <table id="country" class="table table-bordered" style="width:100%">
                        <thead>
                            <tr>
                                <th>S.No</th>
                                <th>Name</th>
                                <th>Code</th>
                                <th>Symbol</th>
                                <th>Base Currency</th>
                                <th>Conversion Rate</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr *ngFor="let currency of currencyArr;let i = index">
                                <td>{{i+1}}</td>
                                <td>{{currency.name}}</td>
                                <td>{{currency.code}}</td>
                                <td>{{currency.symbol}}</td>
                                <td>{{currency.baseCurrency}}</td>
                                <td>{{currency.conversionRate}}</td>
                                <td>
                                    <div ngbDropdown container="body">
                                        <button type="button" class="btn btn-sm hide-arrow" ngbDropdownToggle data-toggle="dropdown">
                                            <i class='bx bx-dots-vertical-rounded' style='color:#858080'></i>
                                        </button>

                                        <div ngbDropdownMenu>
                                            <a ngbDropdownItem (click)="editcountry(countryModal,currency)"><i
                                                    class='bx bxs-edit text-success'></i><span
                                                    class="ml-2">Edit</span></a><a ngbDropdownItem (click)="deleteCurency(deletemodal,currency)"><i class='bx bxs-trash-alt'
                                                    style='color:#c32424'></i><span class="ml-2">Delete</span></a>
                                        </div>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>



<ng-template #countryModal let-modal>
    <div class="modal-header">
        <h5 class="modal-title w-100">Currency</h5>
        <button type="button" class="close" aria-label="Close" (click)="modal.dismiss('Cross click')">
            <span aria-hidden="true">&times;</span>
        </button>
    </div>
    <div class="modal-body p-1" id="myModal">
        <form [formGroup]="currencyForm" (ngSubmit)="onSubmit(modal)" autocomplete="off">
            <div class="row">
                <div class="col-sm-12">
                    <div class="form-group ">
                        <label for="name">Name</label>
                        <input id="name" type="text" class="form-control" formControlName="name" placeholder="Name" [ngClass]="{ 'is-invalid': currencySubmitted && f.name.errors}">
                        <div *ngIf="currencySubmitted && f.name.errors" class="invalid-feedback">
                            <div *ngIf="f.name.errors.required">Required</div>
                        </div>
                    </div>
                </div>
                <div class="col-sm-12">
                    <div class="form-group ">
                        <label for="code">Code</label>
                        <input id="code" type="text" class="form-control" formControlName="code" placeholder="Code" [ngClass]="{ 'is-invalid': currencySubmitted && f.code.errors}">
                        <div *ngIf="currencySubmitted && f.code.errors" class="invalid-feedback">
                            <div *ngIf="f.code.errors.required">Required</div>
                        </div>
                    </div>
                </div>
                <div class="col-sm-12">
                    <div class="form-group ">
                        <label for="symbol">Symbol</label>
                        <input id="symbol" type="text" class="form-control" formControlName="symbol" placeholder="Symbol" [ngClass]="{ 'is-invalid': currencySubmitted && f.symbol.errors}">
                        <div *ngIf="currencySubmitted && f.symbol.errors" class="invalid-feedback">
                            <div *ngIf="f.symbol.errors.required">Required</div>
                        </div>
                    </div>
                </div>
                <div class="col-sm-12">
                    <div class="form-group ">
                        <label for="baseCurrency">Base Currency</label>
                        <input id="baseCurrency" type="text" class="form-control" formControlName="baseCurrency" placeholder="Base Currency" [ngClass]="{ 'is-invalid': currencySubmitted && f.baseCurrency.errors}">
                        <div *ngIf="currencySubmitted && f.baseCurrency.errors" class="invalid-feedback">
                            <div *ngIf="f.baseCurrency.errors.required">Required</div>
                        </div>
                    </div>
                </div>
                <div class="col-sm-12">
                    <div class="form-group ">
                        <label for="conversionRate">Conversion Rate</label>
                        <input id="conversionRate" type="text" class="form-control" formControlName="conversionRate" placeholder="Conversion Rate" [ngClass]="{ 'is-invalid': currencySubmitted && f.conversionRate.errors}">
                        <div *ngIf="currencySubmitted && f.conversionRate.errors" class="invalid-feedback">
                            <div *ngIf="f.conversionRate.errors.required">Required</div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="text-right mt-2 ">
                <button type="submit" class="btn btn-sm btn-primary mb-2 p-1">{{buttonText}}</button>
            </div>
        </form>
    </div>
</ng-template>


<ng-template #deletemodal let-modal>
    <div class="modal-header">
        <h5 class="modal-title">Confirm Delete</h5>
        <button type="button" class="close" aria-label="Close" (click)="modal.dismiss('Cross click')">
            <span aria-hidden="true">&times;</span>
        </button>
    </div>
    <div class="modal-body">
        <h6 class="text-center mt-2">Are you sure want to delete?</h6>
        <div class="text-right mt-2 ">
            <button type="button" class="btn btn-primary  ml-2 " (click)="delete(modal)">Yes</button>
        </div>
    </div>

</ng-template>
