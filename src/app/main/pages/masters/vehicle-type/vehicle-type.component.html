<div class="container-fluid px-0">
    <div class="card">
        <div class="card-body">

            <div class="row">
                <div class="col-6">
                    <div class=" pageHeading">
                        <h4 class="">Vehicle Type</h4>
                    </div>
                </div>
                <div class="col-6">
                    <div class="text-right my-auto ">
                        <button type="button" class="btn btn-primary btn-sm p-1 mb-2" (click)="openModal(vehicleModal)">

                            Add
                        </button>
                    </div>
                </div>
            </div>

            <table id="vehicle-table" class="table table-bordered" style="width:100%" >
                <thead>
                    <tr>
                        <th>S.No</th>
                        <th>Name</th>

                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let vehicle of vehicleArr;let i = index">
                        <td>{{i+1}}</td>
                        <td>{{vehicle.name}}</td>
                        <td>
                            <div ngbDropdown container="body">
                                <button type="button" class="btn btn-sm hide-arrow" ngbDropdownToggle data-toggle="dropdown">
                                    <i class='bx bx-dots-vertical-rounded' style='color:#858080'></i>
                                </button>
                                <div ngbDropdownMenu>
                                    <a ngbDropdownItem (click)="editVehicle(vehicleModal,vehicle)"><i
                                            class='bx bxs-edit text-success'></i><span class="ml-2">Edit</span></a><a ngbDropdownItem (click)="deleteModal(deletemodal,vehicle.id)"><i class='bx bxs-trash-alt'
                                            style='color:#c32424'></i><span class="ml-2">Delete</span></a>
                                </div>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>

        </div>
    </div>

    <ng-template #vehicleModal let-modal>
        <div class="modal-header">
            <h5 class="modal-title w-100">Vehicle</h5>
            <button type="button" class="close" aria-label="Close" (click)="modal.dismiss('Cross click')">
                <span aria-hidden="true">&times;</span>
            </button>
        </div>
        <div class="modal-body p-1" id="vehicle">
            <form [formGroup]="vehicleForm" autocomplete="off">
                <div class="row">
                    <div class="col-sm-12">
                        <div class="form-group ">
                            <label for="name">Name</label>
                            <input id="name" type="text" class="form-control" formControlName="name" placeholder="Name" [ngClass]="{ 'is-invalid': vehicleTypeSubmitted && f.name.errors}">
                            <div *ngIf="vehicleTypeSubmitted && f.name.errors" class="invalid-feedback">
                                <div *ngIf="f.name.errors.required">Required</div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="text-right mt-2 pb-1 ">
                    <button type="button" class="btn btn-sm btn-primary  p-1" (click)="onSubmit(modal)">{{buttonText}}</button>
                </div>
            </form>
        </div>
    </ng-template>
    <ng-template #deletemodal let-modal>
        <div class="modal-header">
            <h5 class="modal-title">Confirm Delete</h5>
            <button type="button" class="close" aria-label="Close" (click)="modal.dismiss('Cross click')">
              <span aria-hidden="true">&times;</span>
          </button>
        </div>
        <div class="modal-body">
            <h6 class="text-center mt-2">Are you sure want to delete?</h6>
            <div class="text-right mt-2 ">
                <button type="button" class="btn btn-primary  ml-2 " (click)="deleteVehicle(modal)">Yes</button>
            </div>
        </div>
    </ng-template>
