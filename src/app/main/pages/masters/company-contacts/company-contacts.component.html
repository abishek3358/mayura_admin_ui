<div class="container-fluid px-0">
    <div class="card">
        <div class="card-body">
            <div class="row">
                <div class="col-xl-12">
                    <div class="row">
                        <div class="col-6">
                            <div class=" pageHeading">
                                <h4 class="">Company Contacts</h4>
                            </div>
                        </div>
                        <div class="col-6">
                            <div class="text-right my-auto ">
                                <button type="button" class="btn btn-primary btn-sm p-1 mb-2" (click)="openModal(cmpcontactModal)">
                                    Add
                                </button>
                            </div>
                        </div>
                    </div>
                    <ngx-simplebar>
                    <table id="cmpcontact" class="table table-bordered" style="width:100%">
                        <thead>
                            <tr>
                                <th>S.No</th>
                                <th>Name</th>
                                <th>Role Name</th>
                                <th>Mobile No</th>
                                <th>Email </th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr *ngFor="let cmpcontactData of cmpcontactArr let i = index">
                                <td>{{i+1}}</td>
                                <td>{{cmpcontactData.name}}</td>
                                <td>{{cmpcontactData.roleName}}</td>
                                <td>{{cmpcontactData.mobileNo}}</td>
                                <td>{{cmpcontactData.email}}</td>
                                <td>

                                    <div ngbDropdown container="body">
                                        <button type="button" class="btn btn-sm hide-arrow" ngbDropdownToggle data-toggle="dropdown">
                                            <i class='bx bx-dots-vertical-rounded' style='color:#858080'></i>
                                        </button>

                                        <div ngbDropdownMenu>
                                            <a ngbDropdownItem (click)="editCmpcontacts(cmpcontactModal,cmpcontactData)"><i
                                                    class='bx bxs-edit text-success'></i><span
                                                    class="ml-2">Edit</span></a><a ngbDropdownItem (click)="deleteModal(deleteContacts,cmpcontactData)"><i class='bx bxs-trash-alt'
                                                    style='color:#c32424'></i><span class="ml-2">Delete</span></a>
                                        </div>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                    </ngx-simplebar>

                </div>
            </div>
        </div>
    </div>
</div>

<ng-template #cmpcontactModal let-modal>
    <div class="modal-header">
        <h5 class="modal-title w-100">Company Contacts</h5>
        <button type="button" class="close" aria-label="Close" (click)="modal.dismiss('Cross click')">
            <span aria-hidden="true">&times;</span>
        </button>
    </div>
    <div class="modal-body p-1" id="myModal">
        <form [formGroup]="cmpcontactForm" (ngSubmit)="onSubmit(modal)" autocomplete="off">
            <div class="row">
                <div class="col-sm-12">
                    <div class="form-group ">
                        <label for="name">Name</label>
                        <input id="name" type="text" class="form-control" formControlName="name" placeholder="Name" [ngClass]="{ 'is-invalid': cmpcontactSubmitted && f.name.errors }">
                        <div *ngIf="cmpcontactSubmitted && f.name.errors " class="invalid-feedback">
                            <div *ngIf="f.name.errors.required">Required</div>
                        </div>
                    </div>
                </div>
                <div class="col-sm-12">
                    <div class="form-group ">
                        <label for="roleName">Role Name</label>
                        <input id="roleName" type="text" class="form-control" formControlName="roleName" placeholder="Role Name" [ngClass]="{ 'is-invalid': cmpcontactSubmitted && f.roleName.errors }">
                        <div *ngIf="cmpcontactSubmitted && f.roleName.errors " class="invalid-feedback">
                            <div *ngIf="f.roleName.errors.required">Required</div>
                        </div>
                    </div>
                </div>
                <div class="col-sm-12">
                    <div class="form-group ">
                        <label for="mobileNo">Mobile No</label>
                        <input id="mobileNo" type="text" class="form-control" formControlName="mobileNo" placeholder="Mobile No" [ngClass]="{ 'is-invalid': cmpcontactSubmitted && f.mobileNo.errors }">
                        <div *ngIf="cmpcontactSubmitted && f.mobileNo.errors " class="invalid-feedback">
                            <div *ngIf="f.mobileNo.errors.required">Required</div>
                        </div>
                    </div>
                </div>
                <div class="col-sm-12">
                    <div class="form-group ">
                        <label for="email">Email </label>
                        <input id="email" type="text" class="form-control" formControlName="email" placeholder="Email " [ngClass]="{ 'is-invalid': cmpcontactSubmitted && f.email.errors }">
                        <div *ngIf="cmpcontactSubmitted && f.email.errors " class="invalid-feedback">
                            <div *ngIf="f.email.errors.required">Required</div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="text-right mt-2 ">
                <button type="submit" class="btn btn-sm btn-primary mb-2 p-1">{{buttonText}}</button>
            </div>
        </form>
    </div>
</ng-template>
<ng-template #deleteContacts let-modal>
    <div class="modal-header">
        <h5 class="modal-title">Confirm Delete</h5>
        <button type="button" class="close" aria-label="Close" (click)="modal.dismiss('Cross click')">
            <span aria-hidden="true">&times;</span>
        </button>
    </div>
    <div class="modal-body">
        <h6 class="text-center mt-2">Are you sure want to delete?</h6>
        <div class="text-right mt-2 ">
            <button type="button" class="btn btn-primary  ml-2 " (click)="delete(modal)">Yes</button>
        </div>
    </div>

</ng-template>
