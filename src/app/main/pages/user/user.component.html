<div class="container-fluid px-0">
    <div class="card">
        <div class="card-body">
            <div class="row">
                <div class="col-6">
                    <div class=" pageHeading">
                        <h4 class="">User</h4>
                    </div>
                </div>
                <div class="col-6">
                    <div class="text-right my-auto ">
                        <button type="button" class="btn btn-primary btn-sm mb-2" routerLink="new">

                            Add
                        </button>
                    </div>
                </div>
            </div>
            <ngx-simplebar>
                <table id="user-table" class="table table-bordered" style="width:100%">
                    <thead>
                        <tr>
                            <th>S.NO</th>
                            <th>Full Name</th>
                            <th>Email</th>
                            <th>User Name</th>
                            <th>Mobile No</th>
                            <th>User Type</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr *ngFor="let user of userArr; let i = index">
                            <td>{{i+1}}</td>
                            <td>{{user.fullName}}</td>
                            <td>{{user.email}}</td>
                            <td>{{user.userName}}</td>
                            <td>{{user.phoneNo}}</td>
                            <td>{{user.userType}}</td>
                            <td>
                                <div ngbDropdown container="body">
                                    <button type="button" class="btn btn-sm hide-arrow" ngbDropdownToggle
                                        data-toggle="dropdown">
                                        <i class='bx bx-dots-vertical-rounded' style='color:#858080'></i>
                                    </button>

                                    <div ngbDropdownMenu>
                                        <a ngbDropdownItem (click)="deleteUser(user.userId)"><i class='bx bxs-trash-alt'
                                                style='color:#c32424'></i><span class="ml-2">Delete</span></a>
                                    </div>
                                </div>

                            </td>
                        </tr>
                    </tbody>
                </table>
            </ngx-simplebar>
        </div>
    </div>
</div>
