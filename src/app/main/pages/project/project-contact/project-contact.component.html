<div class="container-fluid px-0">
    <div class="card">
        <div class="card-body">
            <div class="row">
                <div class="col-xl-12">
                    <div class="row">
                        <div class="col-6">
                            <div class="pageHeading">
                                <h4>Project Contacts</h4>
                            </div>
                        </div>
                        <div class="col-6">
                            <div class="text-right my-auto ">
                                <button type="button" class="btn btn-primary btn-sm p-1 mb-2"
                                    (click)="openModal(myModal)">
                                    Add
                                </button>

                            </div>
                        </div>
                    </div>

                    <table id="project-table" class="table table-bordered" style="width:100%">
                        <thead>
                            <tr>
                                <th>S.No</th>
                                <th>Project Name</th>
                                <th>Employee Name</th>
                                <th>Phone No</th>
                                <th>Emp Code</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr *ngFor="let project of projectcontactArr let i = index">
                                <td>{{i+1}}</td>
                                <td>{{project.projectName}}</td>
                                <td>{{project.empName}}</td>
                                <td>{{project.phoneNumber}}</td>
                                <td>{{project.empCode}}</td>

                                <td>
                                    <div ngbDropdown container="body">
                                        <button type="button" class="btn btn-sm hide-arrow" ngbDropdownToggle
                                            data-toggle="dropdown">
                                            <i class='bx bx-dots-vertical-rounded' style='color:#858080'></i>
                                        </button>

                                        <div ngbDropdownMenu>
                                            <a ngbDropdownItem (click)="editproject(myModal, project)"><i
                                                    class='bx bxs-edit text-success'></i><span
                                                    class="ml-2">Edit</span></a><a ngbDropdownItem
                                                (click)="delete(project)"><i class='bx bxs-trash-alt'
                                                    style='color:#c32424'></i><span class="ml-2">Delete</span></a>
                                        </div>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>


<ng-template #myModal let-modal>
    <div class="modal-header">
        <h5 class="modal-title w-100">Project Contact</h5>
        <button type="button" class="close" aria-label="Close" (click)="modal.dismiss('Cross click')">
            <span aria-hidden="true">&times;</span>
        </button>
    </div>
    <div class="modal-body p-1" id="myModal">
        <form [formGroup]="projectForm" autocomplete="off">
            <div class="row">
                <div class="col-sm-12">
                    <div class="form-group ">
                    <label for="state">Project</label>
                    <ng-select [items]="projectArr" name="stateId" id="stateId" bindLabel="name" bindValue="id"
                        placeholder="Choose" formControlName="projectId"
                        [ngClass]="{ 'is-invalid': ProjectSubmitted && f.projectId.errors}">
                    </ng-select>
                    <div *ngIf="ProjectSubmitted && f.projectId.errors" class="invalid-feedback">
                        <div *ngIf="f.projectId.errors.required">Required</div>
                    </div>
                    </div>
                </div>


                <div class="col-sm-12">
                    <div class="form-group ">
                        <label for="employeeId">Employee </label>
                        <ng-select [items]="empArr" name="name" id="employeeId" bindLabel="name" bindValue="id"
                            placeholder="Choose" formControlName="employeeId"
                            [ngClass]="{ 'is-invalid': ProjectSubmitted && f.employeeId.errors}">
                        </ng-select>
                        <div *ngIf="ProjectSubmitted && f.employeeId.errors" class="invalid-feedback">
                            <div *ngIf="f.employeeId.errors.required">Required</div>
                        </div>
                    </div>
                </div>
                <div class="col-sm-12 ">
                    <div class="form-group ">
                        <label for="name">Employee Type</label>
                        <input id="employeeType" type="text" class="form-control" formControlName="employeeType"
                            placeholder="Employee Type"
                            [ngClass]="{ 'is-invalid': ProjectSubmitted && f.employeeType.errors}">
                        <div *ngIf="ProjectSubmitted && f.employeeType.errors" class="invalid-feedback">
                            <div *ngIf="f.employeeType.errors.required">Required</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="text-right mt-2 ">
                <button type="button" class="btn btn-sm btn-primary mb-2 p-1"
                    (click)="submit(modal)">{{buttonText}}</button>
            </div>
        </form>
    </div>
</ng-template>
