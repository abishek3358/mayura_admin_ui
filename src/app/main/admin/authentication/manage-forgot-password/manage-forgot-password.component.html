<div class="auth-wrapper auth-v2">
    <div class="auth-inner row m-0">
        <!-- Brand logo-->
        <a class="brand-logo">
            <img src="assets/images/logo/logo_hd.jpg" alt="brand-logo"
                style="position: absolute; left: 30px; top: 10px;" height="50" width="100" />
            <!-- <h2 class="brand-text text-primary ml-1">Vuexy</h2></a -->
        </a>
        <!-- /Brand logo-->
        <!-- Left Text-->
        <div class="d-none d-lg-flex col-lg-8 align-items-center px-5">
            <div class="w-100 d-lg-flex align-items-center justify-content-center px-5">
                <img class="img-fluid" [src]="
            coreConfig.layout.skin === 'dark'
              ? 'assets/images/pages/forgot-password-v2-dark.svg'
              : 'assets/images/pages/forgot-password-v2.svg'
          " alt="Forgot password V2" />
            </div>
        </div>
        <!-- /Left Text-->
        <!-- Forgot password-->
        <div class="d-flex mt-5 col-lg-4 align-items-center auth-bg px-2 p-lg-5" style="height: 100%;">
            <div class="col-12 mt-3 col-sm-8 col-md-6 col-lg-12 px-xl-2 mx-auto">
                <h2 class="card-title font-weight-bold mb-1">Forgot Password? 🔒</h2>
                <p class="card-text mb-2">Enter your email than we'll send you instructions to reset
                    your password</p>
                <form class="auth-forgot-password-form mt-2" [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()">
                    <div class="form-group">
                        <label class="form-label" for="forgot-password-email">Email</label>
                        <input class="form-control" type="email" formControlName="userNameOrEmail"
                            placeholder="Enter email" pattern="[A-Za-z0-9._%+-]+@[A-Za-z]+\.[A-Za-z]{1,63}$" aria-describedby="forgot-password-email" autofocus=""
                            tabindex="1" [ngClass]="{ 'is-invalid': submitted && f.userNameOrEmail.errors ||f.userNameOrEmail.invalid && (f.userNameOrEmail.dirty || f.userNameOrEmail.touched)}" />
                        <div *ngIf="submitted && f.userNameOrEmail.errors || f.emailId.invalid && (f.emailId.dirty || f.emailId.touched)" class="invalid-feedback">
                            <div *ngIf="f.userNameOrEmail.errors.required">*Required</div>
                            <div *ngIf="f.userNameOrEmail.errors.pattern">*Enter valid email id</div>
                            <!-- <div *ngIf="f.email.errors.email">Email or username must here</div> -->
                        </div>
                    </div>
                    <button class="btn btn-primary btn-block" tabindex="2" rippleEffect>Get reset link</button>

                    <p class="text-center mt-2">
                        <button class="btn btn-light btn-block" tabindex="2" rippleEffect  routerLink="/login">Back to login</button>
                    </p>
                </form>
            </div>
        </div>
        <!-- /Forgot password-->
    </div>
</div>
