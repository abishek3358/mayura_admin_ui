<div class="container-fluid px-0">
    <div class="card">
        <div class="card-body">
            <div class="row">
                <div class="col-xl-12">
                    <div class="row">
                        <div class="col-6">
                            <div class="pageHeading">
                                <h4 class=""> UOM</h4>
                            </div>
                        </div>
                        <div class="col-6" *ngIf="selectedTab === 1">
                            <div class="text-right my-auto ">
                                <button type="button" class="btn btn-primary btn-sm mb-5" (click)="openModal(myModal)">
                                    Add
                                </button>
                            </div>
                        </div>
                    </div>
                    <!-- <div class="model">
                        <ng-select [items]="['ACTIVE','INACTIVE']" placeholder="Choose" name="polId" id="status"
                            bindLabel="status" bindValue="id" [(ngModel)]="unitofMeasur" (change)="onHide()">
                        </ng-select>
                    </div> -->
                    <ul ngbNav #nav="ngbNav" [activeId]="1" class="nav-tabs nav-tabs-custom mt-1 theme-blue-custom ">
                        <li [ngbNavItem]="1" (click)="onHide()">
                            <a ngbNavLink>
                                <span>ACTIVE</span>
                            </a>
                            <ng-template ngbNavContent>
                                <div class="cardBg">
                                    <div class="card-body">
                                        <table id="active" class="table table-bordered" style="width: 100%;">
                                            <thead class="thead bg-white">
                                                <tr>
                                                    <th>S.NO</th>
                                                    <th>NAME</th>
                                                    <th>SHORT NAME</th>
                                                    <th>STATUS</th>
                                                    <th>ACTION</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                <tr *ngFor="let uom of displayUOM;let i = index">
                                                    <td>{{i+1}}</td>
                                                    <td>{{uom.name}}</td>
                                                    <td>{{uom.shortName}}</td>
                                                    <td>{{uom.status}}</td>
                                                    <td>
                                                        <a ngbDropdownItem (click)="editUom(myModal,uom.id)"><i
                                                                class='bx bxs-edit text-success'></i><span
                                                                class="ml-2"></span></a>
                                                        <!-- <div ngbDropdown container="body">
                                        <button type="button" class="btn btn-sm hide-arrow" ngbDropdownToggle
                                            data-toggle="dropdown">
                                            <i class='bx bx-dots-vertical-rounded' style='color:#858080'></i>
                                        </button>
    
                                        <div ngbDropdownMenu>
                                            <a ngbDropdownItem (click)="editUom(myModal,uom.id)"><i
                                                    class='bx bxs-edit text-success'></i><span class="ml-2">Edit</span></a>
                                        </div>
                                    </div> -->
                                                    </td>
                                                </tr>
                                            </tbody>
                                        </table>

                                    </div>
                                </div>
                            </ng-template>
                        </li>
                        <li [ngbNavItem]="2" (click)="inhideActive()">
                            <a ngbNavLink>
                                <span>INACTIVE</span>
                            </a>
                            <ng-template ngbNavContent>
                                <div class="cardBg">
                                    <div class="card-body">
                                        <table id="inActive" class="table table-bordered" style="width: 100%;">
                                            <thead class="thead bg-white">
                                                <tr>
                                                    <th>S.NO</th>
                                                    <th>NAME</th>
                                                    <th>SHORT NAME</th>
                                                    <th>STATUS</th>
                                                    <th>ACTION</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                <tr *ngFor="let uom of displayActive;let i = index">
                                                    <td>{{i+1}}</td>
                                                    <td>{{uom.name}}</td>
                                                    <td>{{uom.shortName}}</td>
                                                    <td>{{uom.status}}</td>
                                                    <td>
                                                        <a ngbDropdownItem (click)="editUom(myModal,uom.id)"><i
                                                                class='bx bxs-edit text-success'></i><span
                                                                class="ml-2"></span></a>
                                                        <!-- <div ngbDropdown container="body">
                                        <button type="button" class="btn btn-sm hide-arrow" ngbDropdownToggle
                                            data-toggle="dropdown">
                                            <i class='bx bx-dots-vertical-rounded' style='color:#858080'></i>
                                        </button>
    
                                        <div ngbDropdownMenu>
                                            <a ngbDropdownItem (click)="editUom(myModal,uom.id)"><i
                                                    class='bx bxs-edit text-success'></i><span class="ml-2">Edit</span></a>
                                        </div>
                                    </div> -->
                                                    </td>
                                                </tr>
                                            </tbody>
                                        </table>

                                    </div>
                                </div>
                            </ng-template>
                        </li>
                    </ul>
                    <div [ngbNavOutlet]="nav"></div>

                </div>
            </div>
        </div>
    </div>
</div>

<ng-template #myModal let-modal>
    <div class="modal-header">
        <h5 class="modal-title w-100">Unit Of Measurement</h5>
        <button type="button" class="close" aria-label="Close" (click)="modal.dismiss('Cross click')">
            <span aria-hidden="true">&times;</span>
        </button>
    </div>
    <div class="modal-body p-1" id="myModal">
        <form [formGroup]="uomForm" autocomplete="off">
            <div class="row">
                <div class="col-sm-12">
                    <div class="form-group ">
                        <label for="name"> Name</label>
                        <input id="name" type="text" class="form-control" formControlName="name" placeholder=" Name"
                            [ngClass]="{ 'is-invalid': uomSubmitted && f.name.errors}">
                        <div *ngIf="uomSubmitted && f.name.errors" class="invalid-feedback">
                            <div *ngIf="f.name.errors.required">*Required</div>
                        </div>
                    </div>
                </div>


                <div class="col-sm-12">
                    <div class="form-group ">
                        <label for="shortName">Short Name</label>
                        <input id="shortName" type="text" class="form-control" formControlName="shortName"
                            placeholder="Short Name" [ngClass]="{ 'is-invalid': uomSubmitted && f.shortName.errors}">
                        <div *ngIf="uomSubmitted && f.shortName.errors" class="invalid-feedback">
                            <div *ngIf="f.shortName.errors.required">*Required</div>
                        </div>
                    </div>
                </div>
                <div class="col-12">
                    <label for="status">Status</label>
                    <ng-select [items]="['ACTIVE','INACTIVE']" placeholder="Choose" name="polId" id="status"
                        bindLabel="status" bindValue="id" formControlName="status" [(ngModel)]="uomObj.status"
                        [ngClass]="{ 'is-invalid': uomSubmitted && f.status.errors}">
                    </ng-select>
                    <div *ngIf="uomSubmitted && f.status.errors" class="invalid-feedback">
                        <div *ngIf="f.status.errors.required">*Required</div>
                    </div>
                </div>
            </div>
            <div class="text-right mt-2 ">
                <button type="button" class="btn btn-sm btn-primary mb-2 "
                    (click)="onSubmit(modal)">{{buttonText}}</button>
            </div>
        </form>
    </div>
</ng-template>
