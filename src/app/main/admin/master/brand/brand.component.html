<div class="container-fluid mx-auto">
    <div class="row">
        <div class="col-12 pr-0 pl-0">
            <div class="shadow p-2 mb-5 col-md-12 card">
                <div class="row">
                    <div class="col-6">
                        <div class="mb-2 pageHeading">
                            <h4 class="">Brand</h4>
                        </div>
                    </div>
                    <div class="col-6">
                        <div class="text-right my-auto ">
                            <button type="button" class="btn btn-primary btn-sm  mb-2" (click)="openModal(myModal)">
                                Add
                            </button>
                        </div>
                    </div>
                </div>
                <table id="brand" class="table table-bordered" >
                    <thead class="thead bg-white">
                        <tr>
                            <th>S.NO</th>
                            <th>BRAND NAME</th>
                            <th>COUNT</th>
                            <th>DESCRIPTION</th>
                            <th>ACTION</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr *ngFor="let brandObj of brandArr; let i=index">
                            <td>{{i+1}}</td>
                            <td>{{brandObj.brandName}}</td>
                            <td>{{brandObj.productCount}}</td>
                              <td>
                                <ng-container *ngIf="brandObj.description">
                                  {{(brandObj.show) ?brandObj.description : brandObj.description| slice:0:50}}
                                  <a *ngIf="brandObj.description.length > 20;" (click)="brandObj.show = !brandObj.show" > ...{{show ? '.': '...' }}</a>
                                </ng-container>
                              </td>
                            <td>
                                <a ngbDropdownItem (click)="editBrand(myModal,brandObj.id)"><i
                                    class='bx bxs-edit text-success'></i></a>
                                <!-- <div ngbDropdown container="body">
                                    <button type="button" class="btn btn-sm hide-arrow" ngbDropdownToggle
                                        data-toggle="dropdown">
                                        <i class='bx bx-dots-vertical-rounded' style='color:#858080'></i>
                                    </button>
                                    <div ngbDropdownMenu>
                                        <a ngbDropdownItem (click)="editBrand(myModal,brandObj.id)"><i
                                                class='bx bxs-edit text-success'></i><span
                                                class="ml-2">Edit</span></a> -->
                                                <!-- <a ngbDropdownItem
                                            (click)="deleteModal(deleteBrand ,brandObj)">
                                            <i class='bx bxs-trash-alt' style='color:#c32424'></i><span
                                                class="ml-2">Delete</span></a> -->
                                    <!-- </div>
                                </div> -->
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
<ng-template #myModal let-modal>
    <div class="modal-header">
        <h5 class="modal-title w-100">Brand</h5>
        <button type="button" class="close" aria-label="Close" (click)="modal.dismiss('Cross click')">
            <span aria-hidden="true">&times;</span>
        </button>
    </div>
    <div class="modal-body p-1" id="myModal">
        <form [formGroup]="brandForm" autocomplete="off">
            <div class="row">
                <div class="col-sm-12">
                    <div class="form-group ">
                        <label for="brandName">Name</label>
                        <input id="brandName" type="text" class="form-control" formControlName="brandName"
                            placeholder="Name" [ngClass]="{ 'is-invalid': brandSubmitted && f.brandName.errors}">
                        <div *ngIf="brandSubmitted && f.brandName.errors" class="invalid-feedback">
                            <div *ngIf="f.brandName.errors.required">*Required</div>
                        </div>
                    </div>
                </div>
                <div class="col-sm-12">
                    <div class="form-group ">
                        <label for="description">Description</label>
                        <textarea id="description" type="text" class="form-control" formControlName="description"
                            placeholder="Description "
                            [ngClass]="{ 'is-invalid': brandSubmitted && f.description.errors }"></textarea>
                        <div *ngIf="brandSubmitted && f.description.errors" class="invalid-feedback">
                            <div *ngIf="f.description.errors.required">*Required</div>
                        </div>
                    </div>
                </div>
                <div class="col-sm-12 mt-1 ">
                    <label class="mr-1" *ngIf="file">File Upload (jpeg,jpg,png files only supported )</label>
                    <label class="mr-1" *ngIf="reFile">Re Upload (jpeg,jpg,png files only supported )</label>
                    <div class="row ml-0">
                        <label for="file">
                            <i class="bx bx-upload mx-auto " style=" font-size: 25px; cursor: pointer;"></i><span>{{brandObj.fileName}}</span>
                        </label>
                        <input id="file" type="file"  (change)="onUploadChange($event)" formControlName="file"
                            style="display: none;">
                        <label for="filedownload" *ngIf="add" style=" margin-left: 250px;">
                            <i class="bx bx-download mt-0 cursor:pointer ml-2 " style="font-size: 25px;"
                                aria-hidden="true"></i>
                        </label>
                    </div>
                </div>
                <div class="col-sm-12 mt-1">
                    <div class="row">
                        <input id="filedownload" type="file" formControlName="filedownload"
                        (click)="downloadCategoryFile(brandObj.fileUrl)" style="display: none;">
                    </div>
                </div>
            </div>
            <div class="text-right mt-2">
                <button type="button" class="btn btn-sm btn-primary mb-2 "
                    (click)="onSubmit(modal)">{{buttonText}}</button>
            </div>
        </form>
    </div>
</ng-template>
<ng-template #deleteBrand let-modal>
    <div class="modal-header">
        <h5 class="modal-title">Confirm Delete</h5>
        <button type="button" class="close" aria-label="Close" (click)="modal.dismiss('Cross click')">
            <span aria-hidden="true">&times;</span>
        </button>
    </div>
    <div class="modal-body">
        <h6 class="text-center mt-2">Are you sure want to delete?</h6>
        <div class="text-right mt-2 ">
            <button type="button" class="btn btn-primary  ml-2" (click)="delete(modal)">Yes</button>
        </div>
    </div>
</ng-template>
