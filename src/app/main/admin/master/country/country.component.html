<div class="container-fluid px-0">
    <div class="card">
        <div class="card-body">
            <div class="row">
                <div class="col-xl-12">
                    <div class="row">
                        <div class="col-6">
                            <div class="mb-2 pageHeading">
                                <h4 class="">Country</h4>
                            </div>
                        </div>
                    </div>
                    <table id="country-table" class="table table-bordered" style="width:100%">
                        <thead>
                            <tr>
                                <th>S.NO</th>
                                <th>NAME</th>
                                <th>SHORT NAME</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr *ngFor="let countryData of countryArr;let i = index">
                                <td>{{i+1}}</td>
                                <td>{{countryData.name}}</td>
                                <td>{{countryData.shortName}}</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
