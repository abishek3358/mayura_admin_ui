<div class="container-fluid px-0">
    <div class="card">
        <div class="card-body">
            <div class="row">
                <div class="col-xl-12">
                    <div class="row">
                        <div class="col-6">
                            <div class="mb-2 pageHeading">
                                <h4 class="">Product</h4>
                            </div>
                        </div>
                        <div class="col-6">
                            <div class="text-right my-auto ">
                                <button type="button" class="btn btn-primary btn-sm mb-2"
                                    routerLink="/admin/master/products/manage-product">
                                    Add
                                </button>
                            </div>
                        </div>
                    </div>
                    <div class="page">
                        <table id="product" class="table table-bordered" style="width:100%">
                            <thead>
                                <tr>
                                    <th>S.NO</th>
                                    <th>NAME</th>
                                    <th>PRODUCT CODE</th>
                                    <th>HS CODE</th>
                                    <th>PRODUCT CATEGORY</th>
                                    <th>VALIDITY DAYS</th>
                                    <th>ACTION</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr *ngFor="let productObj of productArr;let i = index">
                                    <td>{{i+1}}</td>
                                    <td>{{productObj.productName}}</td>
                                    <td>{{productObj.productCode}}</td>
                                    <td>{{productObj.hsCode}}</td>
                                    <td>{{productObj.productCategoryName}}</td>
                                    <td>{{productObj.productValidityInDays}}</td>
                                    <td>
                                        <a ngbDropdownItem
                                            routerLink="/admin/master/products/manage-product/{{productObj.id}}"><i
                                                class='bx bxs-edit text-success'></i></a>
                                        <!-- <div ngbDropdown container="body">
                                        <button type="button" class="btn btn-sm hide-arrow" ngbDropdownToggle data-toggle="dropdown">
                                            <i class='bx bx-dots-vertical-rounded' style='color:#858080'></i>
                                        </button>

                                        <div ngbDropdownMenu>
                                            <a ngbDropdownItem routerLink="/admin/master/products/manage-product/{{productObj.id}}"><i
                                                    class='bx bxs-edit text-success'></i><span
                                                    class="ml-2">Edit</span></a>

                                        </div>
                                    </div> -->
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
