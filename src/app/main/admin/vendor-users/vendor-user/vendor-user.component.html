</div>
<ng-template #usersModal let-modal>
    <div class="modal-header">
        <h5 class="modal-title w-100">Reset Password</h5>
        <button type="button" class="close" (click)="modal.dismiss('Cross click')" aria-label="Close">
            <span aria-hidden="true">&times;</span>
        </button>
    </div>
    <div class="modal-body p-1" id="myModal">
        <form [formGroup]="vendorUserForm" (ngSubmit)="onSubmit(modol)" autocomplete="off">
            <div class="row">
                <div class="col-sm-12">
                    <div class="form-group ">
                        <label for="name">Old Password</label>
                        <input id="name" type="text" class="form-control" formControlName="oldPassword"
                            placeholder="Old Password"
                            [ngClass]="{ 'is-invalid': vendorUserSubmitted && f.oldPassword.errors }">
                        <div *ngIf="vendorUserSubmitted && f.oldPassword.errors " class="invalid-feedback">
                            <div *ngIf="f.oldPassword.errors.required">*Required</div>
                        </div>
                    </div>
                </div>
                <div class="col-sm-12">
                    <div class="form-group ">
                        <label for="name">New Password</label>
                        <input id="name" type="text" class="form-control" formControlName="newPassword"
                            placeholder="New Password"
                            [ngClass]="{ 'is-invalid': vendorUserSubmitted && f.newPassword.errors }">
                        <div *ngIf="vendorUserSubmitted && f.newPassword.errors " class="invalid-feedback">
                            <div *ngIf="f.newPassword.errors.required">*Required</div>
                        </div>
                    </div>
                </div>
                <div class="col-sm-12">
                    <div class="form-group ">
                        <label for="confirmNewPwrd">Confirm New Password</label>
                        <input id="confirmPassword" type="text" class="form-control" formControlName="confirmPassword"
                            placeholder="Confirm New Password"
                            [ngClass]="{ 'is-invalid': vendorUserSubmitted && f.confirmPassword.errors }">
                        <div *ngIf="vendorUserSubmitted && f.confirmPassword.errors " class="invalid-feedback">
                            <div *ngIf="f.confirmPassword.errors.required">*Required</div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="text-right mt-2 ">
                <button type="submit" class="btn btn-sm btn-primary mb-2 ">{{buttonText}}</button>
            </div>
        </form>
    </div>
</ng-template>
<ng-template #deleteUsers let-modal>
    <div class="modal-header">
        <h5 class="modal-title">Confirm Delete</h5>
        <button type="button" class="close" aria-label="Close" (click)="modal.dismiss('Cross click')">
            <span aria-hidden="true">&times;</span>
        </button>
    </div>
    <div class="modal-body">
        <h6 class="text-center mt-2">Are you sure want to delete?</h6>
        <div class="text-right mt-2 ">
            <button type="button" class="btn btn-primary  ml-2 " (click)="deleteUser(modal)">Yes</button>
        </div>
    </div>

</ng-template>
