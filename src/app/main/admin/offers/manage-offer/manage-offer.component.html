<section class="horizontal-wizard">
    <div id="stepper3" class="bs-stepper horizontal-wizard-example">
        <div class="bs-stepper-header">
            <div class="step" data-target="#personal">
                <button class="step-trigger">
                    <span class="bs-stepper-box">
                        <i class='bx bx-detail font-medium-3'></i>
                    </span>
                    <span class="bs-stepper-label">
                        <span class="bs-stepper-title">Offer Details</span>
                    </span>
                </button>
            </div>
            <div class="line"> <i data-feather="chevron-right" class='bx bx-chevron-right' style='color:#b9b9c3'></i>
            </div>
            <div class="step" data-target="#address">
                <button class="step-trigger">
                    <span class="bs-stepper-box">
                        <i class='bx bx-notepad font-medium-3'></i>
                    </span>
                    <span class="bs-stepper-label">
                        <span class="bs-stepper-title"> Terms And Conditions</span>
                    </span>
                </button>
            </div>
            <div class="line"> <i data-feather="chevron-right" class='bx bx-chevron-right' style='color:#b9b9c3'></i>
            </div>
        </div>
        <div class="bs-stepper-content">
            <form [formGroup]="submittedForm" autocomplete="off">
                <div id="personal" class="content">
                   
                    <div class="row">
                        <div class="form-group col-sm-6">
                            <label for="offerName">Name</label>
                            <input id="offerName" type="text" class="form-control" formControlName="offerName"
                                placeholder="Name"
                                [ngClass]="{ 'is-invalid': offerSubmitted && f.offerName.errors }">
                            <div *ngIf="offerSubmitted && f.offerName.errors" class="invalid-feedback">
                                <div *ngIf="f.offerName.errors.required">*Required</div>
                            </div>
                        </div>
                        <div class="form-group col-sm-6">
                            <label for="offerCode">Code</label>
                            <input id="offerCode" type="text" class="form-control" formControlName="offerCode"
                                placeholder="Code"
                                [ngClass]="{ 'is-invalid': offerSubmitted && f.offerCode.errors }">
                            <div *ngIf="offerSubmitted && f.offerCode.errors" class="invalid-feedback">
                                <div *ngIf="f.offerCode.errors.required">*Required</div>
                            </div>
                        </div>
                        <!-- <div class="form-group col-sm-6">
                            <label for="start">Start Date And Time</label>
                            <input id="start" type="datetime-local" formControlName="start"
                                class="form-control" (change)="started()"
                                [ngClass]="{ 'is-invalid': offerSubmitted && f.start.errors }">
                            <div *ngIf="offerSubmitted && f.start.errors" class="invalid-feedback">
                                <div *ngIf="f.start.errors.required">*Required</div>
                            </div>
                        </div>
                        <div class="form-group col-sm-6">
                            <label for="end">Expiry Date And Time</label>
                            <input id="end" type="datetime-local" formControlName="end"
                                class="form-control" (change)="expired()"
                                [ngClass]="{ 'is-invalid': offerSubmitted && f.end.errors }">
                            <div *ngIf="offerSubmitted && f.end.errors" class="invalid-feedback">
                                <div *ngIf="f.end.errors.required">*Required</div>
                            </div>
                        </div> -->
                        <div class="form-group col-sm-6">
                            <label for="offerType">Offer Type</label>
                            <ng-select [items]="['FLAT','PERCENTAGE','POINTS']" name="polId"
                                placeholder="Select Offer Type" bindLabel="offerType" formControlName="offerType"
                                bindValue="id" [ngClass]="{ 'is-invalid': offerSubmitted && f.offerType.errors }">
                            </ng-select>
                            <div *ngIf="offerSubmitted && f.offerType.errors" class="invalid-feedback">
                                <div *ngIf="f.offerType.errors.required">*Required</div>
                            </div>
                        </div>
                        <div class="form-group col-sm-6">
                            <label for="offerValue">Offer Value</label>
                            <input id="offerValue" type="number" class="form-control" formControlName="offerValue"
                                placeholder="Offer Value"
                                [ngClass]="{ 'is-invalid': offerSubmitted && f.offerValue.errors }">
                            <div *ngIf="offerSubmitted && f.offerValue.errors" class="invalid-feedback">
                                <div *ngIf="f.offerValue.errors.required">*Required</div>
                            </div>
                        </div>

                        <div class="form-group col-sm-6">
                            <label for="minimumOrderAmount">Minimum Order Amount</label>
                            <input id="minimumOrderAmount" type="number" class="form-control"
                                formControlName="minimumOrderAmount" placeholder="Minimum Order Amount"
                                [ngClass]="{ 'is-invalid': offerSubmitted && f.minimumOrderAmount.errors }">
                            <div *ngIf="offerSubmitted && f.minimumOrderAmount.errors" class="invalid-feedback">
                                <div *ngIf="f.minimumOrderAmount.errors.required">*Required</div>
                            </div>
                        </div>
                    </div>
                    <div class="d-flex justify-content-end">
                        <button class="btn btn-primary btn-sm" (click)="next()" rippleEffect>
                            <span class="align-middle d-sm-inline-block d-none">Next</span>
                            <i data-feather="arrow-right" class="align-middle ml-sm-25 ml-0"></i>
                        </button>
                    </div>
                </div>
                <div id="address" class="content">
                    <div class="content-header">
                        <h5 class="mb-0">Product Description</h5>
                    </div>
                    <angular-editor formControlName="termsAndConditions" id="angularEditor"
                        [ngClass]="{ 'is-invalid': offerSubmitted && f.termsAndConditions.errors }">
                    </angular-editor>
                    <div *ngIf="offerSubmitted && f.termsAndConditions.errors" class="invalid-feedback">
                        <div *ngIf="f.termsAndConditions.errors.required">*Required</div>
                    </div>
                    <div class="d-flex justify-content-between">
                        <button class="btn btn-secondary btn-sm mt-2" (click)="previous()" rippleEffect>
                            <i data-feather="arrow-left" class="align-middle mr-sm-25 mr-0"></i>
                            <span class="align-middle d-sm-inline-block d-none">Previous</span>
                        </button>
                        <button class="btn btn-primary btn-sm mt-2" (click)="onSubmit()" rippleEffect>
                            <span class="align-middle d-sm-inline-block d-none">{{buttonText}}</span>
                            <i data-feather="arrow-right" class="align-middle ml-sm-25 ml-0"></i>
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</section>
