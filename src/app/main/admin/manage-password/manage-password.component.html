

<div class="card mb-0 changepwd">
    <div class="card-body">
     
  
      <h4 class="card-title mb-1">Change Password 🔒</h4>
      <p class="card-text mb-2">Your new password must be different from previously used passwords</p>
  
      <form class="auth-reset-password-form mt-2" [formGroup]="resetPasswordForm" (ngSubmit)="onSubmit()">
        <div class="form-group">
          <div class="d-flex justify-content-between">
            <label for="reset-password-new">Old Password</label>
          </div>
          <div class="input-group input-group-merge form-password-toggle">
            <input [type]="oldPasswordTextType ? 'text' : 'password'" formControlName="oldPassword"
              class="form-control form-control-merge" placeholder="Old Password" aria-describedby="reset-password-new"
              tabindex="1" autofocus [ngClass]="{ 'is-invalid error': submitted && f.oldPassword.errors }" />
            <div class="input-group-append">
              <span class="input-group-text cursor-pointer"><i class="feather font-small-4" [ngClass]="{
                        'icon-eye-off': !oldPasswordTextType,
                        'icon-eye': oldPasswordTextType
                      }" (click)="toggleoldPasswordTextType()"></i></span>
            </div>
          </div>
          <div *ngIf="submitted && f.oldPassword.errors" class="invalid-feedback"
            [ngClass]="{ 'd-block': submitted && f.oldPassword.errors }">
            <div *ngIf="f.oldPassword.errors.required">*Required</div>
          </div>
        </div>
        <div class="form-group">
          <div class="d-flex justify-content-between">
            <label for="reset-password-new">New Password</label>
          </div>
          <div class="input-group input-group-merge form-password-toggle">
            <input [type]="newPasswordTextType ? 'text' : 'password'" formControlName="newPassword"
              class="form-control form-control-merge" placeholder="New Password" aria-describedby="reset-password-new"
              tabindex="1" autofocus [ngClass]="{ 'is-invalid error': submitted && f.newPassword.errors }" />
            <div class="input-group-append">
              <span class="input-group-text cursor-pointer"><i class="feather font-small-4" [ngClass]="{
                        'icon-eye-off': !newPasswordTextType,
                        'icon-eye': newPasswordTextType
                      }" (click)="togglenewPasswordTextType()"></i></span>
            </div>
          </div>
          <div *ngIf="submitted && f.newPassword.errors" class="invalid-feedback"
            [ngClass]="{ 'd-block': submitted && f.newPassword.errors }">
            <div *ngIf="f.newPassword.errors.required">*Required</div>
          </div>
        </div>
        <div class="form-group">
          <div class="d-flex justify-content-between">
            <label for="reset-password-confirm">Confirm Password</label>
          </div>
          <div class="input-group input-group-merge form-password-toggle">
            <input [type]="confirmPasswordTextType ? 'text' : 'password'" formControlName="confirmPassword"
              class="form-control form-control-merge" placeholder="Confirm Password" aria-describedby="reset-password-confirm"
              tabindex="2" [ngClass]="{ 'is-invalid error': submitted && f.confirmPassword.errors }" />
            <div class="input-group-append">
              <span class="input-group-text cursor-pointer"><i class="feather font-small-4" [ngClass]="{
                        'icon-eye-off': !confirmPasswordTextType,
                        'icon-eye': confirmPasswordTextType
                      }" (click)="toggleconfirmPasswordTextType()"></i></span>
            </div>
          </div>
          <div *ngIf="submitted && f.confirmPassword.errors" class="invalid-feedback"
            [ngClass]="{ 'd-block': submitted && f.confirmPassword.errors }">
            <div *ngIf="f.confirmPassword.errors.required">*Required</div>
            <div *ngIf="f.confirmPassword.errors.mustMatch">*Password mismatch</div>
          </div>
        </div>
        <div class="text-center">
        <button class="btn btn-primary btn-block" tabindex="3" rippleEffect (click)="onSubmit()">Set New Password</button> 
      </div>
      </form>
    </div>
  </div>
  <!-- /Reset Password v1 -->
